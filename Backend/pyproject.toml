[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sysdent-backend"
version = "1.0.0"
description = "SysDent Pro - Backend API FastAPI Multi-Tenant pour la gestion de cabinets dentaires"
authors = [{ name = "SysDent Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    # <2.1.0 : SQLAlchemy 2.1.x casse le cache de requêtes Cython sous coverage
    # (voir requirements.txt pour le détail).
    "sqlalchemy>=2.0.28,<2.1.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "passlib[argon2,bcrypt]>=1.7.4",
    "pyjwt[crypto]>=2.8.0",
    "structlog>=24.1.0",
    "redis>=5.0.3",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
# Boucle d'événements par test (défaut de pytest-asyncio). Chaque test possède
# ainsi ses propres connexions, détruites avec sa boucle.
# Les tests NE doivent jamais réutiliser un moteur global (`master_engine`) :
# son pool serait attaché à une boucle déjà fermée au test suivant
# (« Event loop is closed »). Les fixtures `master_db` / `tenant_db` créent un
# moteur dédié par test, et la console Master est testée via une surcharge de
# `get_master_db`.
markers = [
    "integration: test nécessitant une base PostgreSQL réelle (les fixtures en créent une jetable)",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.setuptools.packages.find]
where = ["."]

[tool.pyright]
include = ["src", "."]
extraPaths = [".", "src"]

[tool.pyrefly]
import-root = "."
search-path = [".", "src"]
