# Alembic configuration for the SysDent PRO PLATFORM database (backoffice éditeur).
# Third context, alongside `alembic.ini` (base master) and `alembic_tenant.ini`
# (bases clients). Décision D1 de docs/backoffice/00_ETAT_DES_LIEUX.md.
[alembic]
script_location = alembic_platform
prepend_sys_path = .
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S