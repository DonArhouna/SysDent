version: '3.8'

services:
  # Base de données centrale (Master)
  master_db:
    image: postgres:16-alpine
    container_name: sysdent_master_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: sysdent_master
    ports:
      - "5432:5432"
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sysdent_master"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cache Redis & Queue
  redis:
    image: redis:7-alpine
    container_name: sysdent_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sysdent_backend
    restart: always
    depends_on:
      master_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - MASTER_DB_HOST=master_db
      - REDIS_HOST=redis
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_master_data:
  redis_data:
